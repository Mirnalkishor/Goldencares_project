# Firebase App Hosting backend for the TanStack Start web app.
# Nitro (firebase_app_hosting preset) generates .apphosting/bundle.yaml with:
#   runCommand: node .output/server/index.mjs
# The public Firebase web API key is injected at build time from App Hosting's
# automatically provided FIREBASE_WEBAPP_CONFIG (see vite.config.js), so no key
# needs to be stored in this repository. All values below are public identifiers.
runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: VITE_FIREBASE_PROJECT_ID
    value: golden-care-d4863
    availability: [BUILD]
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: goldencares.in
    availability: [BUILD]
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: golden-care-d4863.firebasestorage.app
    availability: [BUILD]
  - variable: VITE_FIREBASE_APP_ID
    value: 1:143097198020:web:1bfefba8807c95495b2091
    availability: [BUILD]
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "143097198020"
    availability: [BUILD]
  - variable: VITE_FIREBASE_MEASUREMENT_ID
    value: G-1E46FR6MEM
    availability: [BUILD]
  - variable: VITE_FIRESTORE_DATABASE_ID
    value: production-mumbai
    availability: [BUILD]
  - variable: VITE_FUNCTIONS_REGION
    value: asia-south1
    availability: [BUILD]
  - variable: VITE_CLARITY_PROJECT_ID
    value: zkgmc21gyu
    availability: [BUILD]
